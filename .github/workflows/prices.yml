name: Update electricity prices

on:
  schedule:
    # Times are UTC. Day-ahead prices are published early afternoon Finnish time.
    - cron: "20 0,12,13,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        run: python scripts/fetch_prices.py
      - name: Commit if changed
        run: |
          git config user.name "steamfox-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || (git commit -m "Update electricity prices" && git push)
